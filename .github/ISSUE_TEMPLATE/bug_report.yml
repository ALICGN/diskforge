name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte **keine privaten Dateinamen oder Pfade** posten —
        anonymisiere sie (z. B. `/media/platte/urlaub.jpg`).
  - type: input
    id: version
    attributes:
      label: Fylr-Version
      description: Steht unten links in der Seitenleiste
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, Kernel, Desktop/Session, Dateisystem des Laufwerks
      placeholder: CachyOS, 6.16, KDE Plasma 6 Wayland, NTFS (ntfs3)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Laufwerk /media/platte wählen
        2. Scannen
        3. Duplikate suchen (min. 1 MB)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
      description: Fehlermeldung, Toast-Text oder Log-Ausgabe aus dem Terminal
    validations:
      required: true
  - type: dropdown
    id: filesystem
    attributes:
      label: Betroffenes Dateisystem
      multiple: true
      options:
        - ntfs3
        - fuseblk / ntfs-3g
        - btrfs
        - ext4
        - exFAT
        - Netzwerk (NFS/SMB)
        - unbekannt
  - type: checkboxes
    id: checks
    attributes:
      label: Vorab geprüft
      options:
        - label: Ich habe nach einem existierenden Issue gesucht
          required: true
        - label: Ich nutze die aktuelle Version
          required: true
