name: Release

# Auslösen per Tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux-Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tauri-Build (deb, rpm, AppImage)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DiskForge ${{ github.ref_name }}"
          releaseBody: "Siehe [CHANGELOG.md](CHANGELOG.md)."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Für Distributionspakete ohne tauri-action-Signatur:
      - name: Artefakte sichern
        uses: actions/upload-artifact@v7
        with:
          name: diskforge-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/diskforge
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn
